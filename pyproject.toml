[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-surv"
version = "0.1.0"
description = "Reference-shift-aware cell-state/pathway features for small-cohort survival modeling"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "lifelines>=0.30",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyahocorasick>=2.1",
  "PyYAML>=6",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "xgboost>=2.1",
]

[project.optional-dependencies]
survivalpfn = ["huggingface-hub>=0.30", "torch>=2.5.1,<3"]
rsf = ["scikit-survival>=0.27,<0.28"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
recast-surv = "recast_surv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
